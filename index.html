<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>PIYUSH BARUA — Cinematic Portfolio & Interactive Experience</title>
  <meta name="description" content="An interactive short film portfolio by Piyush Barua — Full Stack Developer & Cybersecurity Researcher." />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  
  <!-- Preload critical Hero visual asset -->
  <link rel="preload" as="image" href="/hero.jpg" fetchpriority="high" />

  <!-- Preconnect to Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;500;700&family=Onest:wght@400;600;700&family=Oswald:wght@500;700&family=Syne:wght@700;800&display=swap" media="print" onload="this.media='all'" />
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;500;700&family=Onest:wght@400;600;700&family=Oswald:wght@500;700&family=Syne:wght@700;800&display=swap" />
  </noscript>
</head>
<body class="bg-black text-white selection:bg-red-600 selection:text-white overflow-x-hidden">
  <div id="root">
    <!-- Instant Zero-Overhead Cinematic HTML Preloader (Replaced when React mounts) -->
    <div id="preloader" style="position:fixed;inset:0;background:#050505;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;user-select:none;">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:18px;">
        <span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#e50914;box-shadow:0 0 14px #e50914;animation:pulse 1s infinite alternate;"></span>
        <span style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;letter-spacing:0.25em;color:#e5e5e5;text-transform:uppercase;font-weight:600;">INITIALIZING TEMPORAL EXPERIENCE</span>
      </div>
      <div style="width:160px;height:2px;background:rgba(255,255,255,0.08);border-radius:2px;overflow:hidden;position:relative;">
        <div style="position:absolute;top:0;left:0;height:100%;background:#e50914;box-shadow:0 0 10px #e50914;border-radius:2px;animation:stream 1.2s infinite ease-in-out;"></div>
      </div>
      <style>
        @keyframes pulse{from{opacity:0.35;transform:scale(0.85)}to{opacity:1;transform:scale(1.15)}}
        @keyframes stream{0%{left:-40%;width:30%}50%{left:30%;width:50%}100%{left:100%;width:30%}}
      </style>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
